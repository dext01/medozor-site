<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Медозор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --surface-2:#EAF0EE; --ink:#12201C; --muted:#5A6A64; --line:#D7E0DC;
  --accent:#0E7268; --accent-ink:#FFFFFF; --bad:#C2273D;
  --c-project:#E0457B; --c-teacher:#0E9F8E; --c-student:#3C82F6; --c-skeptic:#DC2626; --c-org:#8B5CF6;
  --c-insight:#E09400; --c-task:#EF4444; --c-via:#9AA3AE; --c-person:#64748B;
  --font:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0D1412; --surface:#141E1B; --surface-2:#1B2824; --ink:#E3ECE8; --muted:#97A8A1; --line:#27362F;
    --accent:#3CCDBA; --accent-ink:#06201C; --bad:#F2768A; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font)}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* вход */
#lock{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:360px;display:grid;gap:14px}
.brand{font-weight:700;font-size:28px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.lead{color:var(--muted);margin:0}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.btn{padding:11px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);padding:6px 12px;font-weight:500}
.err{color:var(--bad);font-size:14px;min-height:1.4em;margin:0}

/* приложение */
#app{min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
header .brand{font-size:20px}
.meta{color:var(--muted);font-size:13px;font-family:var(--mono)}
.intro{padding:16px 20px 4px;max-width:900px}
.intro p{margin:0;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 20px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:520px;border-top:1px solid var(--line)}
@media (max-width:900px){main{grid-template-columns:1fr} #graph{height:60vh} aside{border-left:none;border-top:1px solid var(--line)}}
#graph{position:relative;overflow:hidden;background:var(--bg)}
#graph svg{width:100%;height:100%;display:block;cursor:grab}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
aside{border-left:1px solid var(--line);background:var(--surface);overflow:auto;max-height:calc(100vh - 0px);padding:18px 20px 40px}
aside h2{margin:0;font-size:20px;line-height:1.25}
aside .sub{color:var(--muted);margin:4px 0 14px;font-size:14px}
aside .kind{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
aside h3{font-size:15px;margin:18px 0 6px}
aside p{margin:0 0 10px}
aside ul{margin:0 0 10px;padding-left:18px}
aside li{margin:3px 0}
.who{font-weight:600;font-size:13px;margin-top:12px}
.who.me{color:#3C6FD1} .who.them{color:var(--accent)}
.rel{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.node circle{stroke:var(--bg);stroke-width:2}
.node text{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}
.node.dim{opacity:.18} .link.dim{opacity:.06}
.link{stroke:var(--line);stroke-width:1.4}
.node.sel circle{stroke:var(--ink);stroke-width:2.5}
</style>
</head>
<body>

<section id="lock">
  <form class="card" id="lock-form" autocomplete="off">
    <div class="brand">Мед<span>озор</span></div>
    <p class="lead">Закрытые материалы исследования. Введите пароль.</p>
    <div class="field">
      <input id="pw" type="password" placeholder="Пароль" aria-label="Пароль" autofocus>
      <button class="btn" id="go" type="submit">Войти</button>
    </div>
    <p class="err" id="err" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div class="brand">Мед<span>озор</span></div>
    <div style="display:flex;gap:12px;align-items:center">
      <span class="meta" id="updated"></span>
      <button class="btn ghost" id="logout" type="button">Выйти</button>
    </div>
  </header>
  <div class="intro"><p id="desc"></p></div>
  <div class="legend" id="legend"></div>
  <main>
    <div id="graph"><span class="hint">Колесо — масштаб, узлы можно перетаскивать, клик — подробности</span></div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(function(){
  var KINDS = {
    project:["Проект","--c-project"], teacher:["Преподаватель","--c-teacher"], student:["Студент","--c-student"],
    skeptic:["Скептик","--c-skeptic"], person:["Собеседник","--c-person"], org:["Организация","--c-org"],
    insight:["Вывод","--c-insight"], task:["Задача","--c-task"], via:["Посредник","--c-via"]
  };
  var css = getComputedStyle(document.documentElement);
  function color(k){ return css.getPropertyValue((KINDS[k]||KINDS.person)[1]).trim(); }
  var B = JSON.parse(document.getElementById('blob').textContent);
  function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }

  async function decrypt(pw){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(B.salt), iterations:B.iter, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(B.iv)}, key, b64(B.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  var form = document.getElementById('lock-form'), err = document.getElementById('err'), go = document.getElementById('go');
  async function tryOpen(pw, silent){
    go.disabled = true; if (!silent) err.textContent = 'Проверяю…';
    try {
      var data = await decrypt(pw);
      try { sessionStorage.setItem('medozor-pw', pw); } catch(e) {}
      render(data);
    } catch(e) {
      if (!silent) err.textContent = 'Неверный пароль. Попробуйте ещё раз.';
    } finally { go.disabled = false; }
  }
  form.addEventListener('submit', function(e){ e.preventDefault(); tryOpen(document.getElementById('pw').value, false); });
  document.getElementById('logout').addEventListener('click', function(){
    try { sessionStorage.removeItem('medozor-pw'); } catch(e) {}
    location.reload();
  });
  try { var saved = sessionStorage.getItem('medozor-pw'); if (saved) tryOpen(saved, true); } catch(e) {}

  function render(D){
    document.getElementById('lock').hidden = true;
    document.getElementById('app').hidden = false;
    document.getElementById('desc').textContent = D.description;
    document.getElementById('updated').textContent = 'обновлено ' + D.updated;

    var used = {}; D.nodes.forEach(function(n){ used[n.kind] = 1; });
    var lg = document.getElementById('legend');
    Object.keys(KINDS).forEach(function(k){
      if (!used[k]) return;
      var s = document.createElement('span'); s.innerHTML = '<i></i>';
      s.firstChild.style.background = color(k); s.appendChild(document.createTextNode(KINDS[k][0])); lg.appendChild(s);
    });

    var byId = {}; D.nodes.forEach(function(n){ byId[n.id] = n; n.deg = 0; });
    D.links.forEach(function(l){ byId[l.source].deg++; byId[l.target].deg++; });
    var nb = {}; D.links.forEach(function(l){ (nb[l.source]=nb[l.source]||[]).push(l.target); (nb[l.target]=nb[l.target]||[]).push(l.source); });

    var host = document.getElementById('graph');
    var W = host.clientWidth || 800, H = host.clientHeight || 560;
    var svg = d3.select(host).append('svg').attr('viewBox', [-W/2, -H/2, W, H]);
    var g = svg.append('g');
    var zoom = d3.zoom().scaleExtent([0.3, 3]).on('zoom', function(e){ g.attr('transform', e.transform); });
    svg.call(zoom).call(zoom.transform, d3.zoomIdentity.scale(0.8));

    var r = function(n){ return n.kind === 'project' ? 18 : 6 + Math.min(10, n.deg * 1.6); };
    var link = g.append('g').selectAll('line').data(D.links).join('line').attr('class','link');
    var node = g.append('g').selectAll('g').data(D.nodes).join('g').attr('class','node').style('cursor','pointer');
    node.append('circle').attr('r', r).attr('fill', function(n){ return color(n.kind); });
    node.append('text').text(function(n){ return n.id; }).attr('x', function(n){ return r(n) + 4; }).attr('y', 4);

    var sim = d3.forceSimulation(D.nodes)
      .force('link', d3.forceLink(D.links).id(function(n){ return n.id; }).distance(function(l){ return l.kind === 'project' ? 190 : 120; }).strength(.6))
      .force('charge', d3.forceManyBody().strength(-650))
      .force('collide', d3.forceCollide().radius(function(n){ return r(n) + 14; }))
      .force('x', d3.forceX().strength(.04)).force('y', d3.forceY().strength(.06))
      .on('tick', function(){
        link.attr('x1', function(l){ return l.source.x; }).attr('y1', function(l){ return l.source.y; })
            .attr('x2', function(l){ return l.target.x; }).attr('y2', function(l){ return l.target.y; });
        node.attr('transform', function(n){ return 'translate(' + n.x + ',' + n.y + ')'; });
      });
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { sim.alpha(1); for (var i=0;i<300;i++) sim.tick(); sim.stop(); }

    node.call(d3.drag()
      .on('start', function(e,n){ if (!e.active) sim.alphaTarget(.25).restart(); n.fx = n.x; n.fy = n.y; })
      .on('drag', function(e,n){ n.fx = e.x; n.fy = e.y; })
      .on('end', function(e,n){ if (!e.active) sim.alphaTarget(0); n.fx = null; n.fy = null; }));
    node.on('click', function(e,n){ select(n.id); });

    var panel = document.getElementById('panel');
    function select(id, focus){
      var n = byId[id]; var near = {}; near[id] = 1; (nb[id]||[]).forEach(function(x){ near[x] = 1; });
      if (focus === false) { node.classed('dim', false).classed('sel', false); link.classed('dim', false); }
      else {
        node.classed('dim', function(d){ return !near[d.id]; }).classed('sel', function(d){ return d.id === id; });
        link.classed('dim', function(l){ return l.source.id !== id && l.target.id !== id; });
      }
      panel.innerHTML = '';
      var k = document.createElement('div'); k.className = 'kind'; k.textContent = (KINDS[n.kind]||KINDS.person)[0];
      var h = document.createElement('h2'); h.textContent = n.id;
      panel.appendChild(k); panel.appendChild(h);
      if (n.sub) { var s = document.createElement('div'); s.className = 'sub'; s.textContent = n.sub; panel.appendChild(s); }
      var rel = document.createElement('div'); rel.className = 'rel';
      (nb[id]||[]).slice().sort().forEach(function(x){
        var c = document.createElement('button'); c.type = 'button'; c.className = 'chip';
        c.innerHTML = '<i></i>'; c.firstChild.style.background = color(byId[x].kind);
        c.appendChild(document.createTextNode(x)); c.addEventListener('click', function(){ select(x); }); rel.appendChild(c);
      });
      panel.appendChild(rel);
      var body = document.createElement('div'); body.innerHTML = n.html; panel.appendChild(body);
      panel.scrollTop = 0;
    }
    svg.on('click', function(e){ if (e.target.tagName === 'svg') select('Медозор', false); });
    select('Медозор', false);
  }
})();
</script>
</body>
</html>
